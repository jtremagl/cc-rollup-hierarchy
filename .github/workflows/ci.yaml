name: CI

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify static assets
        run: |
          test -f index.html
          test -f cc-internal.json
          test -f cc-external.json
          python3 -c "import json; json.load(open('cc-internal.json')); json.load(open('cc-external.json')); print('json ok')"
